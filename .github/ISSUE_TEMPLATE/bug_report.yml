name: Bug report
description: Report a reproducible FocusFlow defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not include private browsing history, credentials or sync keys.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome version and operating system
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
