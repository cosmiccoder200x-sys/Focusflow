name: Feature request
description: Suggest an improvement to FocusFlow
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, permissions or compatibility considerations
