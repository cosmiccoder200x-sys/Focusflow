name: Static checks
on:
  push:
    branches: [main, docs/growth-optimization]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:extension
      - run: npm test
      - run: python3 scripts/package_extension.py
      - name: Inspect package structure
        run: python3 -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.zip')[0]); assert 'extension/manifest.json' in z.namelist(); assert z.testzip() is None"
